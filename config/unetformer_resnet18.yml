augment:
  hflip: true
  rotate90: true
  vflip: true
data:
  ignore_index: 255
  image_size: 1024
  label_encoding: category_code
  num_classes: 9
  root: data/IRSAMap
  test_image_dir: test/image
  test_mask_dir: test/SegLabel_vwsbr
  train_images: train/image
  train_masks: train/SegLabel_vwsbr
  val_image_dir: val/image
  val_mask_dir: val/SegLabel_vwsbr
  val_split: 0.2
model:
  backbone: swsl_resnet18
  decode_channels: 64
  dropout: 0.1
  name: unetformer
  pretrained: true
  window_size: 8
project:
  dataset: IRSAMap
  name: unetformer_resnet18
  task: semantic_segmentation
train:
  aux_loss_weight: 0.4
  batch_size: 4
  checkpoint_dir: checkpoints
  device: cuda
  epochs: 35
  gpu_id: 0
  log_interval: 10
  lr: 0.0006
  num_workers: 4
  save_interval: 10
  seed: 42
  weight_decay: 0.01
