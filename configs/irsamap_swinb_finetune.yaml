experiment:
  name: irsamap_swinb_finetune
  stage: finetune
  description: Stage 3 - Fine-tune Swin-B Stage 2 checkpoint on IRSAMap only

data:
  num_classes: 8
  ignore_index: 255
  image_size: 1024
  irsamap:
    root: data/IRSAMap_prepared
    train_images: train/images
    train_masks: train/masks_rgb
    val_images: val/images
    val_masks: val/masks_rgb
    test_images: test/images
    test_masks: test/masks_rgb
  loveda:
    enabled: false

model:
  name: unetformer
  backbone: swinv2_base_window8_256.ms_in1k
  pretrained: false
  decode_channels: 64
  window_size: 8
  dropout: 0.1

train:
  device: cuda
  gpu_id: 0
  epochs: 25
  batch_size: 4
  val_batch_size: 4
  num_workers: 4
  lr: 0.0003
  weight_decay: 0.01
  aux_loss_weight: 0.4
  seed: 42
  checkpoint_dir: checkpoints
  checkpoint_name: best_irsamap_swinb_finetune.pth
  resume: checkpoints/best_irsamap_swinb_support.pth
  finetune_reset_optimizer: true
  log_interval: 10
  save_interval: 10
  early_stopping_patience: 10

augment:
  hflip: true
  vflip: true
  rotate90: true
