experiment:
  name: irsamap_deeplabv3p_support
  stage: support
  description: Stage 2 - IRSAMap + LoveDA targeted support with DeepLabV3+ ResNet101

data:
  num_classes: 8
  ignore_index: 255
  image_size: 1024
  irsamap:
    root: data/IRSAMap_prepared
    train_images: train/images
    train_masks: train/masks_rgb
    val_images: val/images
    val_masks: val/masks_rgb
    test_images: test/images
    test_masks: test/masks_rgb
  loveda:
    enabled: true
    root: data/LoveDA_prepared
    train_images: train/images
    train_masks: train/masks
    mapping: targeted
    irsamap_weight: 0.8
    loveda_weight: 0.2

model:
  name: deeplabv3p
  backbone: resnet101
  pretrained: true
  dropout: 0.5

train:
  device: cuda
  gpu_id: 0
  epochs: 25
  batch_size: 4
  val_batch_size: 4
  num_workers: 4
  lr: 0.0001
  weight_decay: 0.01
  aux_loss_weight: 0.4
  seed: 42
  checkpoint_dir: checkpoints
  checkpoint_name: best_irsamap_deeplabv3p_support.pth
  log_interval: 10
  save_interval: 10
  early_stopping_patience: 10

augment:
  hflip: true
  vflip: true
  rotate90: true
